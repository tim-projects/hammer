workflows:
  default:
    transitions:
      BACKLOG: ["READY"]
      READY: ["PROGRESSING"]
      PROGRESSING: ["TESTING", "BLOCKED", "REJECTED"]
      TESTING: ["REVIEW", "BLOCKED", "REJECTED", "PROGRESSING"]
      REVIEW: ["STAGING", "TESTING", "BLOCKED", "PROGRESSING"]
      STAGING: ["DONE", "ARCHIVED", "REVIEW", "BLOCKED", "REJECTED", "PROGRESSING"]
      DONE: ["ARCHIVED", "STAGING", "TESTING", "BLOCKED"]
      BLOCKED: ["READY", "PROGRESSING", "TESTING", "REVIEW", "STAGING", "DONE"]
      ARCHIVED: ["READY", "TESTING"]
      REJECTED: ["PROGRESSING"]
    gates:
      TESTING: [incomplete_checkboxes]
      STAGING: [regression_check, audit_integrity]
      DONE: [merge_check]
  docs:
    transitions:
      BACKLOG: ["READY"]
      READY: ["PROGRESSING"]
      PROGRESSING: ["REVIEW", "BLOCKED", "REJECTED"]
      REVIEW: ["STAGING", "BLOCKED", "PROGRESSING"]
      STAGING: ["DONE", "ARCHIVED", "REVIEW", "BLOCKED", "REJECTED", "PROGRESSING"]
      DONE: ["ARCHIVED", "STAGING", "BLOCKED"]
      BLOCKED: ["READY", "PROGRESSING", "REVIEW", "STAGING", "DONE"]
      ARCHIVED: ["READY"]
      REJECTED: ["PROGRESSING"]
    gates:
      STAGING: [audit_integrity]
      DONE: [merge_check]
